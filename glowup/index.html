<style>
:root{--bg:#08080a;--panel:#111013;--line:#2c2820;--fg:#f5f0e6;--muted:#a39b8c;--gold:#e2ad55;--a:#b8843b;--b:#f0c674;--bad:#ff6170;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(800px 500px at 50% -10%,rgba(226,173,85,.14),transparent 60%),var(--bg);color:var(--fg);font-family:"Plus Jakarta Sans",system-ui,sans-serif;padding:20px}
form{width:min(400px,100%);background:linear-gradient(180deg,#16141a,var(--panel));border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:18px;padding:30px 26px;display:grid;gap:14px;box-shadow:0 30px 80px -30px #000}
img{width:220px;max-width:100%;margin:0 auto 4px;display:block}
h1{font:600 22px "Playfair Display",Georgia,serif;margin:0;text-align:center;color:var(--b)}
p{margin:0;text-align:center;color:var(--muted);font-size:13.5px}
label{display:grid;gap:6px;font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.04em}
input{font:500 15px "Plus Jakarta Sans",system-ui,sans-serif;color:var(--fg);background:#0b0a0c;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(226,173,85,.15)}
button{font:700 15px "Plus Jakarta Sans",system-ui,sans-serif;color:#2a1c05;background:linear-gradient(135deg,var(--a),var(--b));border:0;border-radius:10px;padding:13px;cursor:pointer;margin-top:4px}
button[disabled]{opacity:.6;cursor:progress}
button:focus-visible{outline:2px solid var(--b);outline-offset:3px}
.err{color:var(--bad);font-size:13px;text-align:center;min-height:18px}
.foot{font-size:11.5px;color:#6f685d;text-align:center}
</style></head><body>

  var base=await crypto.subtle.importKey('raw',enc.encode(u.trim().toLowerCase()+'\u0000'+p),'PBKDF2',false,['deriveKey']);

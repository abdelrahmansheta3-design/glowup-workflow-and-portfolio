<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a night-shift isometric office (four desks, window wall onto the city) beside an inspector; kanban + log beneath.
   Single committed look: deep-navy night, warm desk-lamp amber as the one accent, muted code colours. */
:root{
  color-scheme:dark;
  --bg:#0a0e1a; --panel:#111728; --panel-2:#151c30; --ink:#e4e7f0; --muted:#8a92a8; --line:#222a40;
  --lamp:#f0c27f;
  --good:#7dd3b0; --warn:#e9b872; --bad:#ef8a80; --idle:#7c86a3;
  --c-penny:#8ea2ff; --c-radar:#6cc4ad; --c-vibe:#c89be0; --c-scout:#e8b46f;
  --code-1:#7fd1b9; --code-2:#93a7ff; --code-3:#e6a8c8; --code-4:#f0c27f; --code-5:#5b6584;
  --wall-l:#1b2342; --wall-r:#161e3b; --wall-trim:#1e2742; --floor:#182038; --floor-line:#1e2744;
  --desk-top:#4a3d5c; --desk-l:#352b44; --desk-r:#2c2439;
  --obj-top:#2a3350; --obj-l:#1f2740; --obj-r:#1a2136; --screen:#0b1222; --screen-edge:#2d3756;
  --sky-top:#0d1430; --sky-bot:#27305a; --city:#0f1530; --city-2:#151c3d; --win-lit:#f3d39a;
  --skin:#c99a7a; --hair:#2a2230; --chair:#20263b;
  --f-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;margin:0}
.wrap{max-width:1300px;margin:0 auto;padding-inline:20px;padding-block:22px 44px;display:grid;gap:16px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,3.4vw,36px);letter-spacing:-.02em;margin:2px 0 0;line-height:1.1;text-wrap:balance}
h1 em{font-style:normal;color:var(--lamp)}
.sub{color:var(--muted);margin:6px 0 0;max-width:60ch}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--idle);flex:none}
.dot.run{background:var(--good);box-shadow:0 0 8px var(--good)} .dot.queue{background:var(--warn)} .dot.ready{background:var(--lamp)} .dot.block{background:var(--bad)}
.main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;min-width:0}
.scene-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.clock{font-family:var(--f-mono);font-size:12px;color:var(--lamp)}
.btn{font:600 12.5px var(--f-body);color:var(--ink);background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:6px 12px;cursor:pointer}
.btn:hover{border-color:var(--lamp)}
.btn:focus-visible,.agent:focus-visible,.person:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
.tag{font:500 10.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:2px 7px}
.stage{background:var(--bg)}
svg#floor{display:block;width:100%;height:auto;max-width:100%}
.roster{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.agent{display:flex;gap:10px;align-items:center;text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:9px 11px;cursor:pointer;color:var(--ink);font:inherit;min-width:0}
.agent[aria-pressed="true"]{border-color:var(--c);box-shadow:0 0 0 1px var(--c) inset, 0 0 22px -8px var(--c)}
.av{width:28px;height:28px;border-radius:50%;background:var(--c);flex:none;display:grid;place-items:center;font:700 12px var(--f-display);color:#0a0e1a}
.agent b{display:block;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agent small{display:block;color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agent>span:last-child{min-width:0}
.insp{display:flex;flex-direction:column}
.insp-head{padding:18px 18px 14px;border-bottom:1px solid var(--line);display:grid;gap:7px}
.insp-head h2{font-family:var(--f-display);font-size:26px;margin:0;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.role{color:var(--muted);margin:0}
.pill{display:inline-flex;align-items:center;gap:6px;font:500 11px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:999px;width:max-content;border:1px solid currentColor}
.pill.run{color:var(--good)} .pill.queue{color:var(--warn)} .pill.ready{color:var(--lamp)} .pill.block{color:var(--bad)}
dl.kv{margin:0;padding:12px 18px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:9px 14px;border-bottom:1px solid var(--line)}
dl.kv dt{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:2px}
dl.kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;min-width:0;overflow-wrap:anywhere}
.mono{font-family:var(--f-mono);font-size:12.5px}
.prog{padding:12px 18px;border-bottom:1px solid var(--line);display:grid;gap:7px}
.bar{height:5px;border-radius:5px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--c,var(--lamp));border-radius:5px;transition:width .4s;box-shadow:0 0 10px var(--c)}
.bar-row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.note{padding:13px 18px;color:var(--muted);font-size:12.5px;margin:0}
.note strong{color:var(--ink)}
.lower{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px}
.sec-h{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);gap:8px}
.sec-h h3{font-family:var(--f-display);font-size:17px;margin:0;font-weight:700}
.kanban{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:12px 16px;overflow-x:auto}
.col{display:grid;gap:8px;align-content:start;min-width:0}
.col h4{margin:0;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.task{background:var(--panel-2);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:9px;padding:8px 10px;font-size:12.5px;line-height:1.35;min-width:0}
.task small{display:block;color:var(--muted);font-size:11px;margin-top:4px}
.log{font-family:var(--f-mono);font-size:12px;padding:10px 16px;display:grid;gap:6px;max-height:300px;overflow:auto}
.log div{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:9px;align-items:baseline}
.log time{color:var(--muted)} .log .who{font-weight:500;color:var(--c)} .log span:last-child{overflow-wrap:anywhere}
/* scene */
.wl{fill:var(--wall-l)} .wr{fill:var(--wall-r)} .trim{fill:var(--wall-trim)}
.fl{fill:var(--floor)} .fline{stroke:var(--floor-line);stroke-width:1;fill:none}
.d-top{fill:var(--desk-top)} .d-l{fill:var(--desk-l)} .d-r{fill:var(--desk-r)}
.o-top{fill:var(--obj-top)} .o-l{fill:var(--obj-l)} .o-r{fill:var(--obj-r)}
.scr{fill:var(--screen);stroke:var(--screen-edge);stroke-width:1}
.tagname rect{fill:rgba(17,23,40,.92);stroke:var(--line)}
.tagname .n{fill:var(--ink);font:700 13px var(--f-body)} .tagname .r{fill:var(--muted);font:400 10px var(--f-mono)}
.person{cursor:pointer}
.typing .arms{animation:type .32s ease-in-out infinite alternate}
@keyframes type{to{transform:translateY(-1.4px)}}
.typing .head{animation:nod 3.2s ease-in-out infinite}
@keyframes nod{40%{transform:translateY(0)}50%{transform:translateY(1.2px)}60%{transform:translateY(0)}}
.flicker{animation:flick 5s ease-in-out infinite} @keyframes flick{50%{opacity:.82}}
.zz{animation:zz 2.6s ease-in-out infinite} @keyframes zz{0%{opacity:0;transform:translateY(4px)}40%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
.blink{animation:blink 1.1s steps(2) infinite} @keyframes blink{50%{opacity:0}}
.steam{animation:steam 3s ease-in-out infinite} @keyframes steam{0%{opacity:0;transform:translateY(2px)}50%{opacity:.6}100%{opacity:0;transform:translateY(-8px)}}
.neonsign{animation:neon 6s infinite} .neonsign.red{animation-delay:-2.7s} @keyframes neon{0%,100%{opacity:1}92%{opacity:1}93%{opacity:.55}94%{opacity:1}96%{opacity:.7}97%{opacity:1}}
@media (prefers-reduced-motion: reduce){.neonsign,.typing .arms,.typing .head,.flicker,.zz,.blink,.steam{animation:none}}
@media (max-width:1020px){.main{grid-template-columns:minmax(0,1fr)}.lower{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){.roster{grid-template-columns:repeat(2,minmax(0,1fr))}.kanban{grid-template-columns:repeat(4,minmax(150px,1fr))}.wrap{padding-inline:16px}}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">Night shift · Dubai</div>
      <h1>Sheta Agent <em>HQ</em></h1>
      <p class="sub">Four agents at their desks while the city sleeps. Tap anyone to see what is on their screen.</p>
    </div>
    <div class="stats" id="stats"></div>
  </header>
  <section class="main">
    <div class="card" style="overflow:hidden">
      <div class="scene-bar">
        <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
          <span class="eyebrow">Floor 01 · Office</span>
          <span class="clock" id="clock"></span>
        </div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <span class="tag" title="Penny, Radar and Vibe show simulated activity until they are connected">Demo activity</span>
          <button class="btn" id="pause" type="button" aria-pressed="false">Pause office</button>
        </div>
      </div>
      <div class="stage">
        <svg id="floor" viewBox="0 0 1200 660" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Night-time office: four people sit side by side at one long desk, code on their monitors, facing a floor-to-ceiling window over the city"></svg>
      </div>
      <div class="roster" id="roster"></div>
    </div>
    <aside class="card insp" id="insp" aria-live="polite"></aside>
  </section>
  <section class="lower">
    <div class="card">
      <div class="sec-h"><h3>Kanban wall</h3><span class="eyebrow" id="kcount"></span></div>
      <div class="kanban" id="kanban"></div>
    </div>
    <div class="card">
      <div class="sec-h"><h3>Activity log</h3><span class="eyebrow"><span class="blink" style="color:var(--good)">●</span> streaming</span></div>
      <div class="log" id="log"></div>
    </div>
  </section>
</div>

<script>
(function(){
const NS="http://www.w3.org/2000/svg";
const el=(tag,attrs={},parent)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);parent&&parent.appendChild(e);return e;};
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const rnd=(a,b)=>a+Math.random()*(b-a);
const AGENTS=[
 {id:"penny",name:"Penny",job:"Sales Agent",role:"Counts every order and spots what sells",color:"var(--c-penny)",
  desk:[2.6,3.0],status:"run",demo:true,schedule:"Every hour, 24/7",source:"Grubtech · orders",output:"Daily report + offer ideas",
  tasks:["Hourly sales trend check","Weekday vs weekend comparison","Top combo ranking"],
  lines:["Pulled last hour of orders from Grubtech · {n} orders","Lunch peak holding at 1–2 PM","Protein bowls up {p}% vs last week","Drafted offer idea: weekday lunch combo","Flagged a slow item for review"]},
 {id:"radar",name:"Radar",job:"Market Agent",role:"Keeps an eye on every competitor",color:"var(--c-radar)",
  desk:[8.0,3.0],status:"queue",demo:true,schedule:"Weekly · Sunday 08:00",source:"Aggregator listings · menus",output:"Weekly benchmark report",
  tasks:["Weekly competitor benchmark"],lines:[]},
 {id:"vibe",name:"Vibe",job:"Trends Agent",role:"Reads the room on social media",color:"var(--c-vibe)",
  desk:[2.6,8.0],status:"run",demo:true,schedule:"Every 3 hours",source:"Social trends · engagement",output:"Content ideas + peak hours",
  tasks:["Trending fitness-food scan","Peak posting hours","Reel hook ideas"],
  lines:["Tracked {n} trending fitness-food posts","Peak engagement window: 7–9 PM","'Meal prep Sunday' hooks are trending","Wrote 5 Reel hooks","Ranked ideas by expected reach"]},
 {id:"scout",name:"Scout",job:"Job Hunter",role:"Finds jobs that fit you and drafts the cover note",color:"var(--c-scout)",
  desk:[8.0,8.0],status:"ready",demo:false,schedule:"8 AM–12 PM · every 2h",source:"JSearch · LinkedIn, Indeed",output:"Email digest to sheeta.ae",
  tasks:["Daily job search · Dubai"],
  snapshot:{found:21,scored:21,matches:7,progress:100,runtime:"01:48",when:"1 Oct, 15:08"}}
];
const byId=Object.fromEntries(AGENTS.map(a=>[a.id,a]));
AGENTS.forEach(a=>{a.runtime=rnd(40,300);a.tokens=Math.floor(rnd(4000,11000));a.progress=Math.floor(rnd(15,60));a.taskIx=0;a.tick=rnd(0,4);});


/* ---------- people (seen from behind, seated, facing their monitors) ---------- */
const LOOK={
 penny:{skin:"#d6a587",hair:"#2b1e1a",suit:"#3a4785",style:"bun"},
 radar:{skin:"#b98565",hair:"#1c1c24",suit:"#2d5a53",style:"short"},
 vibe:{skin:"#e0b693",hair:"#5b3b2b",suit:"#57406f",style:"long"},
 scout:{skin:"#a87355",hair:"#141418",suit:"#6e5232",style:"fade"}
};
function drawPerson(p,a){
  const L=LOOK[a.id], dark="rgba(0,0,0,.24)", rim="#b4c3ff";
  el("ellipse",{cx:0,cy:4,rx:34,ry:9,fill:"#000",opacity:.3},p);
  [[-26,3],[26,3],[-15,10],[15,10],[0,-2]].forEach(([x,y])=>{el("line",{x1:0,y1:2,x2:x,y2:y,stroke:"#2b3150","stroke-width":3.4,"stroke-linecap":"round"},p);el("circle",{cx:x,cy:y+2,r:2.6,fill:"#151a2c"},p);});
  el("rect",{x:-2.5,y:-26,width:5,height:27,rx:2,fill:"#3a4262"},p);
  el("ellipse",{cx:0,cy:-28,rx:25,ry:6,fill:"#1e2438"},p);
  // torso
  el("path",{d:"M-24,-34 C-26,-60 -19,-76 0,-78 C19,-76 26,-60 24,-34 Z",fill:L.suit},p);
  el("path",{d:"M0,-78 C19,-76 26,-60 24,-34 L6,-34 Z",fill:dark,opacity:.6},p);
  el("path",{d:"M0,-78 C-19,-76 -26,-60 -24,-34 L-6,-34 Z",fill:dark,opacity:.25},p);
  el("path",{d:"M-19,-70 C-9,-77 9,-77 19,-70",stroke:rim,"stroke-width":1.2,opacity:.4,fill:"none"},p);
  // arms: elbows out at the sides, forearms going forward to the keyboard (hidden by the body)
  const arms=el("g",{class:"arms"},p);
  el("path",{d:"M-20,-66 C-31,-62 -33,-50 -27,-44",stroke:L.suit,"stroke-width":10,"stroke-linecap":"round",fill:"none"},arms);
  el("path",{d:"M20,-66 C31,-62 33,-50 27,-44",stroke:L.suit,"stroke-width":10,"stroke-linecap":"round",fill:"none"},arms);
  el("path",{d:"M20,-66 C31,-62 33,-50 27,-44",stroke:dark,"stroke-width":10,"stroke-linecap":"round",fill:"none",opacity:.5},arms);
  // mesh backrest
  el("path",{d:"M-21,-29 C-24,-46 -21,-61 -15,-66 C-5,-70 5,-70 15,-66 C21,-61 24,-46 21,-29 Z",fill:"#171c2e",stroke:"#2f3757","stroke-width":1.6},p);
  for(let i=0;i<5;i++)el("path",{d:`M-19,${-35-i*6.4} C-6,${-37.5-i*6.4} 6,${-37.5-i*6.4} 19,${-35-i*6.4}`,stroke:"#262d4a","stroke-width":1,fill:"none"},p);
  el("path",{d:"M-15,-66 C-5,-70 5,-70 15,-66",stroke:rim,"stroke-width":1,opacity:.3,fill:"none"},p);
  // head
  const head=el("g",{class:"head"},p);
  el("path",{d:"M-7,-77 L0,-70 L7,-77 Z",fill:"#e9edf5"},head);
  el("rect",{x:-5,y:-88,width:10,height:12,rx:3,fill:L.skin},head);
  el("rect",{x:-5,y:-88,width:10,height:12,rx:3,fill:dark,opacity:.5},head);
  el("ellipse",{cx:-11,cy:-97,rx:2.8,ry:4,fill:L.skin},head);
  el("ellipse",{cx:11,cy:-97,rx:2.8,ry:4,fill:L.skin},head);
  el("ellipse",{cx:0,cy:-98,rx:11,ry:13,fill:L.skin},head);
  const H=L.hair;
  if(L.style==="bun"){
    el("path",{d:"M-11,-97 C-12,-114 12,-114 11,-97 C10,-90 -10,-90 -11,-97 Z",fill:H},head);
    el("circle",{cx:0,cy:-113,r:6.5,fill:H},head);
    el("path",{d:"M-5,-115 C-2,-119 3,-119 6,-115",stroke:rim,"stroke-width":1.2,opacity:.45,fill:"none"},head);
  } else if(L.style==="short"){
    el("path",{d:"M-11.5,-98 C-12,-116 12,-116 11.5,-98 C11,-91 7,-89 0,-89 C-7,-89 -11,-91 -11.5,-98 Z",fill:H},head);
    el("path",{d:"M-6,-110 C-2,-113 3,-113 7,-110",stroke:rim,"stroke-width":1.2,opacity:.4,fill:"none"},head);
  } else if(L.style==="long"){
    el("path",{d:"M-12,-98 C-13,-117 13,-117 12,-98 C13,-88 15,-80 13,-73 C7,-71 -7,-71 -13,-73 C-15,-80 -13,-88 -12,-98 Z",fill:H},head);
    el("path",{d:"M-6,-111 C-2,-114 3,-114 7,-111",stroke:rim,"stroke-width":1.2,opacity:.4,fill:"none"},head);
  } else {
    el("path",{d:"M-10.5,-100 C-11,-115 11,-115 10.5,-100 C9,-95 -9,-95 -10.5,-100 Z",fill:H},head);
    el("path",{d:"M-10.5,-100 C-9.5,-93 9.5,-93 10.5,-100",stroke:H,"stroke-width":2.6,opacity:.45,fill:"none"},head);
    el("path",{d:"M-6,-111 C-2,-114 3,-114 7,-111",stroke:rim,"stroke-width":1.2,opacity:.4,fill:"none"},head);
  }
  el("rect",{x:-19,y:-71,width:5,height:7,rx:1.2,fill:a.color},p);
}

/* ---------- scene: one-point perspective, team in a row facing a full-height window ---------- */
const svg=document.getElementById("floor");
const W=1200, Hh=660, BW={x0:110,x1:1090,y0:46,y1:392}, VP=[600,230];
const defs=el("defs",{},svg);
const grad=(id,stops,attrs={},type="linearGradient")=>{const g=el(type,{id,...attrs},defs);stops.forEach(([o,c,op])=>el("stop",{offset:o,"stop-color":c,"stop-opacity":op??1},g));};
grad("sky",[["0%","#0b1230"],["65%","#1e2752"],["100%","#3a3466"]],{x1:0,y1:0,x2:0,y2:1});
grad("floorG",[["0%","#1b2342"],["100%","#0e1426"]],{x1:0,y1:0,x2:0,y2:1});
grad("reflect",[["0%","#8f9bff",.16],["100%","#8f9bff",0]],{x1:0,y1:0,x2:0,y2:1});
grad("lampPool",[["0%","#f0c27f",.32],["60%","#f0c27f",.07],["100%","#f0c27f",0]],{},"radialGradient");
grad("pend",[["0%","#f6d39a",.55],["100%","#f6d39a",0]],{},"radialGradient");
grad("screenGlow",[["0%","#9ab4ff",.28],["100%","#9ab4ff",0]],{},"radialGradient");
grad("moon",[["0%","#fdf3d9"],["100%","#e3cf9c"]],{},"radialGradient");
grad("wallL",[["0%","#151b33"],["100%","#1d2547"]],{x1:0,y1:0,x2:1,y2:0});
grad("wallR",[["0%","#1d2547"],["100%","#151b33"]],{x1:0,y1:0,x2:1,y2:0});

const fill=s=>s.replace("{n}",()=>Math.floor(rnd(10,48))).replace("{p}",()=>Math.floor(rnd(5,22)));
[["15:06:55","Clocked in · searching LinkedIn, Indeed & Glassdoor"],["15:07:10","21 new jobs after dropping sales roles & duplicates"],["15:08:30","Scored 21 jobs · 7 are 7/10 or higher"],["15:08:43","Emailed today's 7 matches · clocked out"]].forEach(([t,m])=>log(byId.scout,m,t));
log(byId.radar,"Off shift · back Sunday 08:00");
log(byId.penny,"Started hourly trend check");
log(byId.vibe,"Started trend scan");

const clockEl=document.getElementById("clock");
let paused=false,last=performance.now(),acc=0;
document.getElementById("pause").addEventListener("click",e=>{paused=!paused;e.currentTarget.textContent=paused?"Resume office":"Pause office";e.currentTarget.setAttribute("aria-pressed",String(paused));AGENTS.forEach(a=>a.person.classList.toggle("typing",!paused&&a.status==="run"&&!reduce));});
function loop(t){
  const dt=Math.min(.1,(t-last)/1000);last=t;
  clockEl.textContent=new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit",timeZone:"Asia/Dubai"})+" Dubai";
  if(!paused){
    acc+=dt;
    AGENTS.forEach(a=>{ if(a.status!=="run")return;
      a.runtime+=dt;a.tokens+=Math.floor(dt*rnd(20,90));a.tick+=dt;
      if(a.tick>7){a.tick=0;log(a,fill(a.lines[Math.floor(Math.random()*a.lines.length)]));a.progress+=Math.floor(rnd(6,14));
        if(a.progress>=100){a.progress=5;a.taskIx++;a.runtime=0;log(a,"Finished: "+a.tasks[(a.taskIx-1)%a.tasks.length]);}}
    });
    if(acc>(reduce?2:.28)){acc=0;AGENTS.forEach(a=>{ if(a.status!=="run")return; a.screens.forEach(sc=>{ if(Math.random()<.6){sc.rows.shift();sc.rows.push(newRow());} else {const r=sc.rows[sc.rows.length-1];r.len=Math.min(70,r.len+6);} drawScreen(sc,a);});});}
    renderInsp(false);
  }
  requestAnimationFrame(loop);
}
renderStatus();select("scout");requestAnimationFrame(loop);

/* ---------- live mode: when this page is served by n8n it reads the agents' real status ---------- */
const DATA_URL="https://abdelrahmansheta.app.n8n.cloud/webhook/agent-hq-data";
const MAP={running:"run",done:"ready",error:"block",queued:"queue"};
const tfmt=iso=>new Date(iso).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit",second:"2-digit",timeZone:"Asia/Dubai"});
const dfmt=iso=>new Date(iso).toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit",timeZone:"Asia/Dubai"});
let liveLogKey="";
async function pull(){
  let d; try{const r=await fetch(DATA_URL,{cache:"no-store"}); if(!r.ok)return; d=await r.json();}catch(e){return;}
  const agents=d.agents||{};
  Object.entries(agents).forEach(([id,v])=>{const a=byId[id]; if(!a)return;
    let st=MAP[v.status]||a.status;
    let stale=false; if(st==="run" && Date.now()-Date.parse(v.updatedAt)>45*60*1000){st="ready";stale=true;} // a run that never reported back found nothing new
    a.status=st; a.demo=false; a.live=true;
    a.snapshot={found:v.found??"—",scored:v.scored??"—",matches:v.matches??"—",progress:st==="run"?45:100,runtime:v.runtime||"—",when:dfmt(v.updatedAt)};
    if(v.task)a.tasks=[v.task];
    a.summary=stale?"Finished. No new jobs since the last run, so no email today.":(v.summary||a.summary);
    if(a.screens) a.screens.forEach(sc=>drawScreen(sc,a));
  });
  const key=JSON.stringify((d.log||[]).slice(0,3));
  if(d.log&&d.log.length&&key!==liveLogKey){liveLogKey=key;
    [...logEl.children].forEach(r=>{if(r.dataset.live||r.querySelector(".who").textContent==="Scout")r.remove();});
    d.log.slice(0,20).reverse().forEach(e=>{const a=byId[e.agent];if(!a)return;log(a,e.message,tfmt(e.at));logEl.firstChild.dataset.live="1";});}
  renderStatus(); renderInsp(true);
}
pull(); setInterval(pull,30000);

})();
</script>
